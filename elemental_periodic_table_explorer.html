<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elemental — Periodic Table Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-card: #ffffff;
      --bg-media: #f4f4f0;
      --text-primary: #202124;
      --text-secondary: #3c4043;
      --text-muted: #5f6368;
      --border-color: #202124;
      --border-subtle: #dadce0;
      --accent-blue: #1a73e8;
      --accent-blue-hover: #1557b0;
      --accent-like: #d93025;
      --radius-card: 28px;
      --radius-media: 20px;
      --radius-pill: 9999px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Category Colors (soft, high-contrast editorial palette) */
      --cat-alkali-metal: #fee2e2;
      --cat-alkaline-earth: #ffedd5;
      --cat-transition-metal: #fef9c3;
      --cat-post-transition: #dcfce7;
      --cat-metalloid: #ccfbf1;
      --cat-nonmetal: #dbeafe;
      --cat-halogen: #e0e7ff;
      --cat-noble-gas: #f3e8ff;
      --cat-lanthanide: #fce7f3;
      --cat-actinide: #ffe4e6;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 28px 24px 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       HERO: INTERACTIVE PERIODIC TABLE
       ========================================================================== */
    .hero-table-card {
      width: 100%;
      max-width: 1120px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      overflow: hidden;
    }

    .hero-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: clamp(1.75rem, 3vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .hero-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      padding: 9px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      outline: none;
      width: 220px;
      background: #ffffff;
      color: var(--text-primary);
      transition: box-shadow 0.15s ease;
    }

    .search-input:focus {
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.25);
      border-color: var(--accent-blue);
    }

    .btn-outline {
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 9px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-outline:hover {
      background-color: #f1f3f4;
    }

    .filter-bar {
      padding: 12px 32px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background-color: #fafafa;
    }

    .filter-pill {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: #ffffff;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .filter-pill:hover {
      border-color: var(--border-color);
    }

    .filter-pill.is-active {
      background-color: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    .ptable-scroll {
      padding: 20px 24px 24px;
      overflow-x: auto;
      background-color: #ffffff;
    }

    .ptable-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(44px, 1fr));
      grid-template-rows: repeat(7, auto) 12px repeat(2, auto);
      gap: 4px;
      min-width: 860px;
    }

    .el-tile {
      position: relative;
      border: 1px solid rgba(32, 33, 36, 0.35);
      border-radius: 8px;
      padding: 5px 4px;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: var(--text-primary);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease, border-color 0.12s ease;
    }

    .el-tile:hover {
      transform: translateY(-2px);
      border-color: var(--border-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      z-index: 2;
    }

    .el-tile.is-selected {
      border: 2px solid var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
      z-index: 3;
    }

    .el-tile.is-dimmed {
      opacity: 0.22;
    }

    .el-num {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      line-height: 1;
      color: var(--text-secondary);
    }

    .el-sym {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .el-name {
      font-size: 0.5625rem;
      line-height: 1.1;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .series-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--text-muted);
      border: 1px dashed var(--border-subtle);
      border-radius: 8px;
      padding: 4px;
    }

    /* ==========================================================================
       TEMPLATE CARD 1: ELEMENT HERO CARD
       ========================================================================== */
    .project-card {
      width: 100%;
      max-width: 1120px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .card-left {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
    }

    .card-section {
      padding: 26px 32px;
      border-bottom: 1px solid var(--border-color);
    }

    .card-title-section {
      padding: 28px 32px 24px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: clamp(2rem, 3.8vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: var(--text-primary);
    }

    .card-symbol-badge {
      font-family: var(--font-mono);
      font-size: 1.125rem;
      font-weight: 600;
      padding: 4px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      background-color: var(--bg-media);
    }

    .card-desc-section {
      flex: 1;
      display: flex;
      align-items: flex-start;
    }

    .card-description {
      font-size: clamp(1.05rem, 1.45vw, 1.25rem);
      font-weight: 400;
      line-height: 1.48;
      color: var(--text-primary);
    }

    .card-meta-section {
      padding: 22px 32px;
    }

    .card-meta {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 84px 84px;
      min-height: 84px;
    }

    .action-cta-cell {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border-color);
    }

    .btn-primary {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-blue-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .action-icon-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-icon-cell + .action-icon-cell {
      border-left: 1px solid var(--border-color);
    }

    .btn-icon {
      width: 100%;
      height: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-icon:hover {
      background-color: #f1f3f4;
    }

    .btn-icon.is-liked {
      color: var(--accent-like);
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
    }

    /* Right Column: Interactive Bohr Shell & Element Card Visual */
    .card-right {
      padding: 24px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .media-slot {
      width: 100%;
      min-height: 380px;
      border-radius: var(--radius-media);
      background-color: var(--bg-media);
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .bohr-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .bohr-atomic-tag {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 4px 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
    }

    .bohr-mass-tag {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--text-secondary);
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
    }

    .bohr-canvas-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 8px 0;
    }

    .bohr-svg {
      width: 100%;
      max-width: 250px;
      height: auto;
    }

    .bohr-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px 14px;
    }

    /* ==========================================================================
       TEMPLATE CARD 2: DETAILS CARD (Monospace + Sidebar)
       ========================================================================== */
    .details-card {
      width: 100%;
      max-width: 1120px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      overflow: hidden;
    }

    .details-left {
      padding: 34px 36px 38px;
      border-right: 1px solid var(--border-color);
      font-family: var(--font-mono);
      font-size: 0.9125rem;
      line-height: 1.65;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .details-lead {
      font-weight: 600;
    }

    .details-subheading {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-top: 6px;
      color: var(--text-primary);
    }

    .details-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .details-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .details-list-icon {
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .details-right {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background-color: var(--bg-card);
    }

    .sidebar-block {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-media);
      background-color: var(--bg-media);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .spec-key {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .spec-val {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-btn {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--accent-blue);
      background: transparent;
      border: none;
      padding: 2px 0;
      text-align: left;
      cursor: pointer;
    }

    .sidebar-btn:hover {
      text-decoration: underline;
    }

    .favorites-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .fav-chip {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-primary);
      cursor: pointer;
    }

    .fav-chip:hover {
      background: var(--text-primary);
      color: #ffffff;
    }

    .fav-empty {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       TOAST NOTIFICATION
       ========================================================================== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background-color: var(--text-primary);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.875rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 860px) {
      body {
        padding: 16px;
      }

      .hero-header,
      .filter-bar {
        padding: 18px 20px;
      }

      .project-card,
      .details-card {
        grid-template-columns: 1fr;
      }

      .card-left,
      .details-left {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .card-section,
      .card-title-section,
      .card-meta-section,
      .details-left,
      .details-right {
        padding: 22px 24px;
      }

      .card-actions {
        grid-template-columns: 1fr 68px 68px;
        min-height: 76px;
      }

      .card-right {
        padding: 16px;
      }

      .media-slot {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>

  <!-- HERO: INTERACTIVE PERIODIC TABLE -->
  <section class="hero-table-card" id="periodic-table" aria-label="Elemental Periodic Table">
    <div class="hero-header">
      <div class="brand-group">
        <h1 class="brand-title">Elemental</h1>
        <span class="brand-subtitle">Interactive Periodic Table Explorer · Click any element</span>
      </div>
      <div class="hero-controls">
        <input type="search" class="search-input" id="searchInput" placeholder="Search name, symbol, #..." aria-label="Search elements" />
        <button type="button" class="btn-outline" id="randomBtn">Random element</button>
      </div>
    </div>

    <div class="filter-bar" id="filterBar" role="group" aria-label="Filter by element category"></div>

    <div class="ptable-scroll">
      <div class="ptable-grid" id="ptableGrid"></div>
    </div>
  </section>

  <!-- TEMPLATE CARD 1: SELECTED ELEMENT HERO -->
  <main class="project-card" id="element-card">
    <div class="card-left">
      <header class="card-section card-title-section">
        <h2 class="card-title" id="elTitle">Hydrogen</h2>
        <span class="card-symbol-badge" id="elSymbolBadge">H · #1</span>
      </header>

      <section class="card-section card-desc-section">
        <p class="card-description" id="elSummary"></p>
      </section>

      <section class="card-section card-meta-section">
        <p class="card-meta" id="elMeta"></p>
        <div class="card-tags" id="elTags"></div>
      </section>

      <footer class="card-actions">
        <div class="action-cta-cell">
          <button type="button" class="btn-primary" id="launchBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
            <span id="launchBtnText">Next element</span>
          </button>
        </div>

        <div class="action-icon-cell">
          <button type="button" class="btn-icon" id="likeBtn" aria-label="Bookmark element" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
        </div>

        <div class="action-icon-cell">
          <button type="button" class="btn-icon" id="shareBtn" aria-label="Share element">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <!-- Right Column: Dynamic Bohr Shell Diagram -->
    <div class="card-right">
      <div class="media-slot" id="mediaSlot">
        <div class="bohr-top">
          <span class="bohr-atomic-tag" id="bohrAtomic">Z = 1</span>
          <span class="bohr-mass-tag" id="bohrMass">1.008 u</span>
        </div>
        <div class="bohr-canvas-wrap" id="bohrWrap"></div>
        <div class="bohr-bottom">
          <span id="bohrConfig">1s¹</span>
          <span id="bohrShells">Shells: 1</span>
        </div>
      </div>
    </div>
  </main>

  <!-- TEMPLATE CARD 2: ELEMENT DETAILS & SIDEBAR -->
  <section class="details-card" aria-label="Element technical details">
    <div class="details-left">
      <p class="details-lead" id="detailsLead"></p>
      <p id="detailsOverview"></p>
      <p id="detailsUses"></p>

      <div>
        <h3 class="details-subheading">Atomic &amp; Physical Properties</h3>
        <ul class="details-list" id="detailsProps"></ul>
      </div>
    </div>

    const CATEGORIES = {

      if (Array.isArray(saved)) likedSet = new Set(saved);

    const ptableGrid = document.getElementById('ptableGrid');

    const likeBtn = document.getElementById('likeBtn');
    const shareBtn = document.getElementById('shareBtn');
    const launchBtn = document.getElementById('launchBtn');
    const prevElBtn = document.getElementById('prevElBtn');
    const nextElBtn = document.getElementById('nextElBtn');
    const backTopBtn = document.getElementById('backTopBtn');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('is-visible');
      }, 2200);
    }

    function saveLikes() {
      try {
        localStorage.setItem('elemental_likes', JSON.stringify(Array.from(likedSet)));
      } catch (e) {}
    }

    function renderFilters() {
      filterBar.innerHTML = '';
      Object.entries(CATEGORIES).forEach(([key, meta]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-pill' + (activeCategory === key ? ' is-active' : '');
        if (key !== 'all') {
          const dot = document.createElement('span');
          dot.className = 'filter-dot';
          dot.style.backgroundColor = meta.color;
          btn.appendChild(dot);
        }
        const label = document.createElement('span');
        label.textContent = meta.label;
        btn.appendChild(label);
        btn.addEventListener('click', () => {
          activeCategory = key;
          renderFilters();
          renderTable();
        });
        filterBar.appendChild(btn);
      });
    }

    function renderTable() {
      ptableGrid.innerHTML = '';
      const q = searchQuery.trim().toLowerCase();

      // Series markers for 57-71 and 89-103 in main grid
      const lanMarker = document.createElement('div');
      lanMarker.className = 'series-marker';
      lanMarker.style.gridRow = '6';
      lanMarker.style.gridColumn = '3';
      lanMarker.textContent = '57–71';
      ptableGrid.appendChild(lanMarker);

      const actMarker = document.createElement('div');
      actMarker.className = 'series-marker';
      actMarker.style.gridRow = '7';
      actMarker.style.gridColumn = '3';
      actMarker.textContent = '89–103';
      ptableGrid.appendChild(actMarker);

      ELEMENTS.forEach((el) => {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'el-tile';
        tile.style.gridRow = String(el.row);
        tile.style.gridColumn = String(el.col);
        tile.style.backgroundColor = CATEGORIES[el.category].color;
        tile.setAttribute('aria-label', `${el.name}, atomic number ${el.number}`);

        const matchesCat = activeCategory === 'all' || el.category === activeCategory;
        const matchesQuery = !q ||
          el.name.toLowerCase().includes(q) ||
          el.symbol.toLowerCase().includes(q) ||
          String(el.number) === q;

        if (!matchesCat || !matchesQuery) {
          tile.classList.add('is-dimmed');
        }
        if (el.number === selectedNumber) {
          tile.classList.add('is-selected');
        }

        tile.innerHTML = `
          <span class="el-num">${el.number}</span>
          <span class="el-sym">${el.symbol}</span>
          <span class="el-name">${el.name}</span>
        `;

        tile.addEventListener('click', () => {
          selectElement(el.number, true);
        });
        ptableGrid.appendChild(tile);
      });
    }

    function renderBohrSVG(el) {
      const size = 240;
      const cx = size / 2;
      const cy = size / 2;
      const shells = el.shells;
      const maxR = 104;
      const minR = 26;
      const step = shells.length > 1 ? (maxR - minR) / (shells.length - 1) : 0;

      let svgParts = [
        `<svg class="bohr-svg" viewBox="0 0 ${size} ${size}" role="img" aria-label="Bohr electron shell diagram for ${el.name}">`,
        `<circle cx="${cx}" cy="${cy}" r="18" fill="#202124" />`,
        `<text x="${cx}" y="${cy + 5}" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">${el.symbol}</text>`
      ];

      shells.forEach((count, idx) => {
        const r = shells.length === 1 ? 58 : minR + idx * step;
        svgParts.push(`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="#5f6368" stroke-width="1" stroke-dasharray="3 2" />`);
        for (let i = 0; i < count; i++) {
          const angle = (2 * Math.PI * i) / count - Math.PI / 2;
          const ex = cx + r * Math.cos(angle);
          const ey = cy + r * Math.sin(angle);
          svgParts.push(`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.2" fill="#1a73e8" stroke="#ffffff" stroke-width="0.8" />`);
        }
      });

      svgParts.push('</svg>');
      return svgParts.join('');
    }

        <span class="tag-pill">${el.phase}</span>

      `;

      const nextNum = el.number === 118 ? 1 : el.number + 1;
      const nextEl = ELEMENTS[nextNum - 1];
      document.getElementById('launchBtnText').textContent = `Next: ${nextEl.name} (${nextEl.symbol})`;

      // Like button state
      const isLiked = likedSet.has(el.number);
      likeBtn.classList.toggle('is-liked', isLiked);
      likeBtn.setAttribute('aria-pressed', String(isLiked));
      likeBtn.querySelector('path').setAttribute('fill', isLiked ? 'currentColor' : 'none');

      // Bohr visual
      document.getElementById('bohrAtomic').textContent = `Z = ${el.number}`;
      document.getElementById('bohrMass').textContent = `${el.mass} u`;
      document.getElementById('bohrWrap').innerHTML = renderBohrSVG(el);
      document.getElementById('bohrConfig').textContent = el.config;
      document.getElementById('bohrShells').textContent = `Shells: ${el.shells.join(' · ')}`;

      // Bottom details card
      document.getElementById('detailsLead').textContent =

      document.getElementById('detailsOverview').textContent = el.summary;

      document.getElementById('detailsProps').innerHTML = `

      `;

      document.getElementById('specGrid').innerHTML = `
        <div class="spec-item"><span class="spec-key">Atomic Number</span><span class="spec-val">${el.number}</span></div>
        <div class="spec-item"><span class="spec-key">Atomic Mass</span><span class="spec-val">${el.mass} u</span></div>
        <div class="spec-item"><span class="spec-key">Phase (298 K)</span><span class="spec-val">${el.phase}</span></div>
        <div class="spec-item"><span class="spec-key">Block</span><span class="spec-val">${el.block}-block</span></div>
        <div class="spec-item"><span class="spec-key">Group / Period</span><span class="spec-val">${el.group} / ${el.period}</span></div>
        <div class="spec-item"><span class="spec-key">Electronegativity</span><span class="spec-val">${el.en}</span></div>
      `;

      renderFavorites();
    }

    function renderFavorites() {
      const wrap = document.getElementById('favoritesWrap');
      wrap.innerHTML = '';
      if (likedSet.size === 0) {
        const p = document.createElement('span');
        p.className = 'fav-empty';
        p.textContent = 'Click the heart button on any element to bookmark it here.';
        wrap.appendChild(p);
        return;
      }
      Array.from(likedSet).sort((a, b) => a - b).forEach((num) => {
        const el = ELEMENTS[num - 1];
        if (!el) return;
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'fav-chip';
        chip.textContent = `${el.symbol} #${el.number}`;
        chip.addEventListener('click', () => selectElement(el.number, true));
        wrap.appendChild(chip);
      });
    }

    function selectElement(num, shouldScroll = false) {
      selectedNumber = num;
      const el = ELEMENTS[num - 1];
      renderTable();
      renderDetails(el);
      try {
        history.replaceState(null, '', '#element=' + el.symbol);
      } catch (e) {}
      if (shouldScroll) {
        document.getElementById('element-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Event listeners
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTable();
    });

    randomBtn.addEventListener('click', () => {
      const rand = Math.floor(Math.random() * 118) + 1;
      selectElement(rand, false);
      showToast(`Selected ${ELEMENTS[rand - 1].name}`);
    });

    launchBtn.addEventListener('click', () => {
      const nextNum = selectedNumber === 118 ? 1 : selectedNumber + 1;
      selectElement(nextNum, false);
    });

    prevElBtn.addEventListener('click', () => {
      const prevNum = selectedNumber === 1 ? 118 : selectedNumber - 1;
      selectElement(prevNum, false);
    });

    nextElBtn.addEventListener('click', () => {
      const nextNum = selectedNumber === 118 ? 1 : selectedNumber + 1;
      selectElement(nextNum, false);
    });

    backTopBtn.addEventListener('click', () => {
      document.getElementById('periodic-table').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    likeBtn.addEventListener('click', () => {
      const el = ELEMENTS[selectedNumber - 1];
      if (likedSet.has(selectedNumber)) {
        likedSet.delete(selectedNumber);
        showToast(`Removed ${el.name} from bookmarks`);
      } else {
        likedSet.add(selectedNumber);
        showToast(`Bookmarked ${el.name}`);
      }
      saveLikes();
      renderDetails(el);
    });

    shareBtn.addEventListener('click', async () => {
      const el = ELEMENTS[selectedNumber - 1];
      const shareUrl = window.location.href.split('#')[0] + '#element=' + el.symbol;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(shareUrl);
        } else {
          const tempInput = document.createElement('input');
          tempInput.value = shareUrl;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand('copy');
          document.body.removeChild(tempInput);
        }
        showToast(`Copied ${el.name} link to clipboard`);
      } catch (err) {
        showToast(`${el.name} (#${el.number}) ready to share`);
      }
    });

    // Check URL hash on load
    (function init() {
      const hash = window.location.hash || '';
      const m = hash.match(/^#element=([A-Za-z]{1,3}|\d{1,3})$/);
      if (m) {
        const val = m[1].toLowerCase();
        const found = ELEMENTS.find(e => e.symbol.toLowerCase() === val || String(e.number) === val);
        if (found) selectedNumber = found.number;
      }
      renderFilters();
      renderTable();
      renderDetails(ELEMENTS[selectedNumber - 1]);
    })();
  </script>
</body>
</html>
